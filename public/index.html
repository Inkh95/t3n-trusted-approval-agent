<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>T3N Trusted Approval Agent</title><style>:root{color-scheme:dark;--bg:#080b10;--p:#111722;--line:#253044;--g:#60f0b0;--a:#ffc857;--r:#ff6b7a;--t:#eef4ff;--m:#94a3b8}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% 0,#10253a,var(--bg) 40%);font:15px system-ui;color:var(--t)}main{max-width:980px;margin:auto;padding:48px 20px}h1{font-size:clamp(30px,6vw,58px);margin:8px 0}.tag{color:var(--g);letter-spacing:.15em;text-transform:uppercase}.sub,.meta{color:var(--m)}.sub{font-size:18px;max-width:650px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:32px}.card{background:var(--p);border:1px solid var(--line);border-radius:18px;padding:22px}.wide{grid-column:1/-1}label{display:block;color:var(--m);margin:12px 0 6px}input,select,textarea,button{width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);background:#0a0f18;color:var(--t)}textarea{min-height:75px}button{background:var(--g);color:#04110b;font-weight:800;border:0;margin-top:14px;cursor:pointer}.secondary{background:#243047;color:var(--t)}.action{border:1px solid var(--line);border-radius:12px;padding:14px;margin-top:12px}.badge{display:inline-block;border-radius:99px;padding:4px 9px;background:#263247;margin-right:8px}.approval_required{color:var(--a)}.deny{color:var(--r)}.allow{color:var(--g)}pre{white-space:pre-wrap;word-break:break-word;color:#b7c8dd}@media(max-width:700px){.grid{grid-template-columns:1fr}.wide{grid-column:auto}}</style></head><body><main><div class="tag">Terminal 3 × Task Hunter</div><h1>Trusted Approval Agent</h1><p class="sub">AI can research and draft autonomously. Sensitive actions stop at a cryptographically bound human approval gate.</p><div class="grid"><section class="card"><h2>Request an action</h2><label>Action</label><select id="type"><option value="research.read">Read-only research</option><option value="application.submit">Submit application</option><option value="message.send">Send message</option><option value="payment.send">Send payment</option><option value="credential.share">Share raw credential</option><option value="captcha.solve">Solve CAPTCHA</option></select><label>Target</label><input id="target" value="task-platform.example"><label>Summary</label><textarea id="summary">Submit the completed paid-task application.</textarea><button onclick="requestAction()">Evaluate policy</button></section><section class="card"><h2>Trust status</h2><pre id="status">Loading…</pre><p class="meta">Every decision is chained into a tamper-evident audit log.</p></section><section class="card wide"><h2>Approval queue</h2><div id="actions">No actions yet.</div></section></div></main><script>
const api=(p,o)=>fetch(p,{headers:{'content-type':'application/json'},...o}).then(async r=>{const b=await r.json();if(!r.ok)throw Error(b.error);return b});async function load(){const[s,a]=await Promise.all([api('/api/status'),api('/api/actions')]);status.textContent=JSON.stringify(s,null,2);actions.innerHTML=a.length?'':'No actions yet.';a.slice().reverse().forEach(x=>{const e=document.createElement('div');e.className='action';e.innerHTML=`<span class="badge ${x.policy.decision}">${x.policy.decision}</span><b>${x.action.type}</b><p>${x.action.summary}</p><div class="meta">${x.policy.reason}</div>`;if(x.status==='pending'&&x.policy.decision==='approval_required'){const b=document.createElement('button');b.textContent='Approve & execute once';b.onclick=()=>approve(x.action.id);e.appendChild(b)}if(x.status==='pending'&&x.policy.decision==='allow'){const b=document.createElement('button');b.className='secondary';b.textContent='Execute allowed action';b.onclick=()=>execute(x.action.id);e.appendChild(b)}actions.appendChild(e)})}async function requestAction(){try{await api('/api/actions',{method:'POST',body:JSON.stringify({type:type.value,target:target.value,summary:summary.value,payload:{source:'dashboard'}})});await load()}catch(e){alert(e.message)}}async function approve(id){try{const{token}=await api(`/api/actions/${id}/approve`,{method:'POST',body:'{}'});await api(`/api/actions/${id}/execute`,{method:'POST',body:JSON.stringify({token})});await load()}catch(e){alert(e.message)}}async function execute(id){try{await api(`/api/actions/${id}/execute`,{method:'POST',body:'{}'});await load()}catch(e){alert(e.message)}}load();</script></body></html>
