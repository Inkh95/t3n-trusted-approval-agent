  <rect x="775" y="210" width="360" height="290" class="box" fill="#12383f" stroke="#36c5b5"/>
  <text x="955" y="265" text-anchor="middle" class="h">Deterministic Safety Gate</text>
  <text x="955" y="310" text-anchor="middle" class="t">AI use allowed</text>
