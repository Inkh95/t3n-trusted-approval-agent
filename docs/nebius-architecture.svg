<text class="s" x="200" y="365" text-anchor="middle">GitHub • Devpost</text>
<text class="s" x="200" y="400" text-anchor="middle">Bounties • Contests</text>
<text class="s" x="200" y="435" text-anchor="middle">Paid online work</text>

