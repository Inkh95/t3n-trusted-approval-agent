name: Aegis Home CI

on:
  push:
    branches: [amazon-aegis-home]
    paths:
      - 'aegis-home/**'
      - '.github/workflows/aegis-home-ci.yml'
  pull_request:
    paths:
      - 'aegis-home/**'
      - '.github/workflows/aegis-home-ci.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aegis-home
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm test
