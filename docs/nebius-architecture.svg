<text class="s" x="575" y="400" text-anchor="middle">Zero-cost participation</text>
<text class="s" x="575" y="435" text-anchor="middle">Verified payout &amp; reward</text>
<text class="s" x="575" y="470" text-anchor="middle">KYC / CAPTCHA / legal scope</text>

<rect class="box" x="820" y="205" width="330" height="230" fill="#3e2b66" stroke="#8b67c7"/>
