<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#16213a"/></linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#8ba7d9"/></marker>
    <style>
      .title{font:700 44px Arial,sans-serif;fill:#fff}.sub{font:22px Arial,sans-serif;fill:#aebbd0}
      .h{font:700 25px Arial,sans-serif;fill:#fff}.t{font:19px Arial,sans-serif;fill:#cad5e6}
      .box{stroke-width:2;rx:20}.line{stroke:#8ba7d9;stroke-width:4;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <text x="80" y="80" class="title">T3N Trusted Approval Agent</text>
