  <text x="800" y="704" text-anchor="middle" class="h">Hash-Chained Audit Log</text>
  <text x="800" y="748" text-anchor="middle" class="t">Decision · policy rule · action · integrity</text>

  <path d="M325 355 H405" class="line"/><path d="M695 355 H775" class="line"/>
  <path d="M1135 310 C1170 310 1178 260 1220 260" class="line"/>
  <path d="M1135 400 C1170 400 1178 490 1220 490" class="line"/>
