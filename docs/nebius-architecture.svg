<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">T3N Nebius Edition architecture</title>
<desc id="desc">Paid-task opportunity flows through deterministic T3N policy checks, Nebius-hosted NVIDIA Nemotron reasoning, economic scoring, routing, and tamper-evident audit logging.</desc>
<rect width="1600" height="900" fill="#0b1220"/>
<text x="80" y="90" font-family="Arial,Helvetica,sans-serif" font-size="48" font-weight="700" fill="#f5f7fb">T3N Nebius Edition</text>
<text x="80" y="132" font-family="Arial,Helvetica,sans-serif" font-size="24" fill="#aab6c8">Probabilistic reasoning. Deterministic authorization. Auditable outcomes.</text>

<defs>
  <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#b9c7da"/></marker>
  <style>
    .box{stroke-width:3;rx:24;ry:24}.t{font:700 28px Arial,Helvetica,sans-serif;fill:#f4f7fb}.s{font:20px Arial,Helvetica,sans-serif;fill:#d7e0eb}.a{stroke:#b9c7da;stroke-width:6;fill:none;marker-end:url(#arrow)}
  </style>
</defs>

